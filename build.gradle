plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.1'
	id 'io.spring.dependency-management' version '1.1.4'
	id "org.sonarqube" version "7.2.0.6526"
	id 'jacoco'
}

group = 'com.pacifico'
version = '0.0.2-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('liquibaseVersion', '4.25.0')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	//R2DBC
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	runtimeOnly 'io.r2dbc:r2dbc-mssql:1.0.0.RELEASE'

	//JDBC - SOLO para Liquibase
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

	//LIQUIBASE
	implementation "org.liquibase:liquibase-core:${liquibaseVersion}"

	//VALIDATION
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//MAPSTRUCT
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	//LOMBOK
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	//GUAVA
	implementation 'com.google.guava:guava:32.1.3-jre'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test

	reports {
		xml.required = true
		html.required = true
	}
}

sonarqube {
	properties {
		property "sonar.projectKey", "ms-customer-management"
		property "sonar.projectName", "ms-customer-management"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.token", "sqp_21737f8cd7b319c0bbaa3241f89d17c132fea4b9"
		property "sonar.sources", "src/main/java"
		property "sonar.tests", "src/test/java"
		property "sonar.coverage.jacoco.xmlReportPaths",
				layout.buildDirectory
						.file("reports/jacoco/test/jacocoTestReport.xml")
						.get()
						.asFile
						.absolutePath
		property "sonar.java.binaries",
				layout.buildDirectory.file("classes/java/main").get().asFile.absolutePath
	}
}